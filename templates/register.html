<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | AppraiseX</title><link rel="stylesheet" href="{{ url_for('static',filename='css/app.css') }}"></head>
<body class="auth-page"><div class="auth-card"><div class="brand auth-brand"><div class="brand-mark">AX</div><div><strong>AppraiseX</strong><span>Employee Performance Portal</span></div></div><h1>Employee Registration</h1><p class="muted">Create an employee account. New public registrations are limited to the employee role.</p><form id="registerForm"><div class="form-grid"><div class="span-2"><label>Full name</label><input id="name" required></div><div class="span-2"><label>Email</label><input id="email" type="email" required></div><div><label>Password</label><input id="password" type="password" minlength="6" required></div><div><label>Employee code</label><input id="employee_code" required></div><div><label>Department</label><input id="department" required></div><div><label>Designation</label><input id="designation" required></div><div><label>Joining date</label><input id="joining_date" type="date"></div></div><button class="primary-btn full-btn" type="submit">Register Employee</button><div id="msg" class="form-message"></div></form><p class="auth-link"><a href="/">Already registered? Sign in</a></p></div><script>
const form=document.getElementById('registerForm'),msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='form-message';msg.textContent='Creating account...';const body={name:name.value.trim(),email:email.value.trim(),password:password.value,employee_code:employee_code.value.trim(),department:department.value.trim(),designation:designation.value.trim(),joining_date:joining_date.value||null};try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||d.success===false)throw Error(d.message||'Registration failed');msg.textContent='Registration successful. Redirecting to login...';setTimeout(()=>location.href='/',900)}catch(x){msg.className='form-message error';msg.textContent=x.message}});
</script></body></html>
